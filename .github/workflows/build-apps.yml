name: Multi-Platform App Builds & GitHub Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. Android APK Build (Capacitor)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_EXPORT: "true"
          NEXT_PUBLIC_API_URL: "https://masterchefind-bot.onrender.com"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Install Capacitor CLI & Android
        run: |
          npm install --save-dev @capacitor/cli@^6.0.0 @capacitor/core@^6.0.0 @capacitor/android@^6.0.0
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Rename and Prepare Versioned APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/masterchef-v1.${{ github.run_number }}.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masterchef-android-apk
          path: build-output/masterchef-v1.${{ github.run_number }}.apk

  # ==========================================
  # 2. Windows Executable (.exe) Build (Electron)
  # ==========================================
  build-windows:
    name: Build Windows Application (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_EXPORT: "true"
          NEXT_PUBLIC_API_URL: "https://masterchefind-bot.onrender.com"

      - name: Package Windows Executable with electron-builder
        run: npx --yes electron-builder --win --x64 --config electron-builder.json --publish never

      - name: Rename and Prepare Versioned Windows Executable
        shell: bash
        run: |
          mkdir -p build-output
          EXE_FILE=$(ls dist-electron/*.exe | head -n 1)
          cp "$EXE_FILE" "build-output/masterchef-v1.${{ github.run_number }}.exe"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masterchef-windows-app
          path: build-output/masterchef-v1.${{ github.run_number }}.exe

  # ==========================================
  # 3. iOS Application Build (Capacitor / Xcode)
  # ==========================================
  build-ios:
    name: Build iOS Project / App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_EXPORT: "true"
          NEXT_PUBLIC_API_URL: "https://masterchefind-bot.onrender.com"

      - name: Install Capacitor Core & iOS
        run: |
          npm install --save-dev @capacitor/cli@^6.0.0 @capacitor/core@^6.0.0 @capacitor/ios@^6.0.0
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS App with Xcode (Simulator build)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Zip and Prepare Versioned iOS App
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-output"
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/build-output/masterchef-v1.${{ github.run_number }}.zip" App.app

      - name: Upload iOS Build Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: masterchef-ios-build
          path: build-output/masterchef-v1.${{ github.run_number }}.zip

  # ==========================================
  # 4. Automatic GitHub Release Publishing
  # ==========================================
  create-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v8
        with:
          name: masterchef-android-apk
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: masterchef-windows-app
          path: release-assets

      - name: Download iOS Artifact
        uses: actions/download-artifact@v8
        with:
          name: masterchef-ios-build
          path: release-assets

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          body: |
            ## 👨‍🍳 What's New in MasterChef v1.${{ github.run_number }}

            ### 🌐 Offline & Persistent Caching
            - **Instant Offline Access**: Menu items and historical weeks are now stored in dual-layer local storage so you can view your canteen menu anytime without an internet connection.
            - **PWA Service Worker**: Full progressive web app offline fallback caching (`sw.js`) and web app manifest (`manifest.json`) for seamless "Add to Home Screen" support on mobile & desktop.

            ### 📱 Native Multi-Platform Applications
            - 🤖 **Android (`.apk`)**: Standalone Android application with native shell.
            - 🪟 **Windows (`.exe`)**: Standalone installer for Windows PCs powered by Electron.
            - 🍎 **iOS (`.zip`)**: Native iOS simulator build archive and Xcode workspace project.

            ### ⚡ Live API & Cloud Sync
            - Connected directly to live backend endpoint: `https://masterchefind-bot.onrender.com`.
            - Automated weekly menu synchronization, admin authentication, PDF parsing, and Telegram broadcasts.

            ---
            ### 📥 Download Assets Below
            - **Android APK**: `masterchef-v1.${{ github.run_number }}.apk`
            - **Windows Installer**: `masterchef-v1.${{ github.run_number }}.exe`
            - **iOS Build**: `masterchef-v1.${{ github.run_number }}.zip`
          files: |
            release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
